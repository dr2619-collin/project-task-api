[project]
name = "project-task-api"
version = "0.7.0"
description = "Course demonstration API for managing projects and tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]

[tool.pytest.ini_options]
# This course project keeps the importable application package in ./app instead
# of installing it as a distribution. Add the repository root while pytest runs.
pythonpath = ["."]
testpaths = ["tests"]
# Test files can share a source-mirrored name such as test_projects.py because
# pytest imports each test module by its full path instead of a top-level name.
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "schemathesis>=4.24.3",
    "testcontainers[postgres]>=4.15.0",
]
